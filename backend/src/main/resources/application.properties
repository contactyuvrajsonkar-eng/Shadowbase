spring.application.name=testcontainers-postgres-manager

# We do NOT want Spring Boot to connect to a database on startup.
# Our own code creates the database later (via POST /api/databases/start)
# and builds its own JDBC connections using the dynamic port.

spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
# --- Sandbox container settings (read by our service) ---
sandbox.postgres.image=postgres:16-alpine
sandbox.postgres.database=sandbox_db
sandbox.postgres.username=sandbox_user
# Maximum number of sandboxes alive at once
sandbox.max-sandboxes=3